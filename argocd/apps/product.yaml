# ArgoCD Application: keep release "product" in the cluster equal to what Git says.
apiVersion: argoproj.io/v1alpha1        # API group added by the ArgoCD CRDs
kind: Application                       # the new kind registered by the CRD
metadata:
  name: product
  namespace: argocd                     # Application objects live where ArgoCD runs
spec:
  project: default                      # AppProject "default": no extra restrictions
  source:                               # WHERE to read the desired state
    repoURL: https://github.com/Duytrg7/shopmesh-gitops.git
    targetRevision: main                # branch to follow
    path: charts/shopmesh-app           # the Helm chart inside the repo
    helm:
      releaseName: product              # same name as the old Helm release → same object names
      valueFiles:
        - ../../values/product.yaml     # relative to "path" → values/product.yaml at the repo root
  destination:                          # WHERE to install it
    server: https://kubernetes.default.svc   # this cluster's API server, seen from inside the cluster
    namespace: shopmesh
  syncPolicy:
    automated:
      prune: true       # delete objects that were removed from Git
      selfHeal: true    # undo manual changes made directly on the cluster
