# 20-product.yaml – product service on Kubernetes
# Compose equivalent: the `product` block (image + environment + ports + depends_on)
---
# Non-secret settings (Compose: part of `environment:`)
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-config
data:
  DB_HOST: postgres        # name of the postgres Service → same DNS idea as Compose
  DB_PORT: "5432"          # ConfigMap values are always strings → quote numbers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels:
    app: product
spec:
  replicas: 2              # 2 identical Pods (Compose ran only 1) → the Service spreads requests
  selector:
    matchLabels:
      app: product         # the Pods this Deployment owns (through a ReplicaSet)
  template:                # Pod blueprint
    metadata:
      labels:
        app: product       # must match the selector; the Service also selects on it
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001    # numeric UID of appuser → kubelet can verify it is not root
      containers:
        - name: product
          image: shopmesh/product:0.3.0
          imagePullPolicy: IfNotPresent   # use the copy loaded into the node, never pull
          ports:
            - name: http
              containerPort: 8001         # uvicorn --port 8001 inside the container
          env:
            # 1) non-secret parts from the ConfigMap
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: product-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: product-config, key: DB_PORT }
            # 2) secret parts from the Secret created on Day 8
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_DB }
            # 3) the one variable the app reads; $(VAR) = value of a variable defined ABOVE
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          livenessProbe:                  # alive? → restart if /health fails
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:                 # can serve? → remove from the Service if /ready fails (DB down)
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2           # 2 failures in a row (≈10 s) → NotReady
          resources:
            requests: { cpu: 50m, memory: 64Mi }   # what the scheduler reserves on the node
            limits:   { memory: 256Mi }            # above this the container is OOMKilled
---
# Stable name product:8001 in front of the 2 Pods (Compose: service name = DNS)
apiVersion: v1
kind: Service
metadata:
  name: product
spec:
  type: ClusterIP          # reachable only inside the cluster (default type)
  selector:
    app: product           # send traffic to Pods with this label
  ports:
    - name: http
      port: 8001           # port of the Service (what callers use: product:8001)
      targetPort: http     # named port on the Pod (= 8001)